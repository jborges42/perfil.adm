<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Qual é o seu perfil ADM? · ADM Experience</title>
  <meta name="description" content="Quiz do ADM Experience, do Técnico em Administração da EEB Eurico Pinz.">
  <link rel="icon" href="assets/marca/curso-simbolo.webp">
  <link rel="stylesheet" href="assets/fontes/fontes.css">
  <link rel="stylesheet" href="estilo.css">
  <script src="dados.js" defer></script>
  <script src="jogo.js" defer></script>
</head>
<body data-tela="inicio">
  <svg class="sprite" aria-hidden="true" focusable="false">
    <!-- ícones de interface (traço) -->
    <symbol id="i-voltar" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
    <symbol id="i-som" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-mudo" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5zM22 9l-6 6M16 9l6 6"/></symbol>
    <symbol id="i-imprimir" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></symbol>
    <symbol id="i-reiniciar" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5"/></symbol>
    <symbol id="i-seta" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
    <!-- ícones dos perfis (provisórios) -->
    <symbol id="ic-criativo" viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4"/></symbol>
    <symbol id="ic-estrategista" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol>
    <symbol id="ic-conector" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/><circle cx="9" cy="7" r="4"/></symbol>
    <symbol id="ic-executor" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></symbol>
  </svg>

  <header class="barra">
    <img class="barra-logo" src="assets/marca/adm-experience-adesivo.webp" alt="ADM Experience" width="1331" height="533">
    <div class="progresso" role="progressbar" aria-valuemin="0" aria-valuemax="16" aria-valuenow="1" data-t-label="progresso_label">
      <div class="progresso-trilho">
        <span class="progresso-fill"></span>
        <img class="progresso-coroa" src="assets/marca/coroa.png" alt="" width="222" height="154">
      </div>
      <span class="progresso-texto"></span>
    </div>
    <div class="barra-acoes">
      <button class="icone-botao" id="btn-voltar" type="button" data-t-label="back_button" hidden><svg><use href="#i-voltar"/></svg></button>
      <button class="icone-botao" id="btn-som" type="button" data-t-label="som_label" aria-pressed="true"><svg class="som-on"><use href="#i-som"/></svg><svg class="som-off"><use href="#i-mudo"/></svg></button>
    </div>
  </header>

  <main class="palco">
    <!-- 1. início -->
    <section class="tela" id="inicio">
      <div class="inicio-heroi">
        <img class="inicio-logo entra" src="assets/marca/adm-experience.webp" alt="ADM Experience" width="1305" height="533">
        <p class="kicker entra" data-t="start_kicker"></p>
        <h1 class="inicio-titulo entra">Qual é o seu <span class="marca-texto">perfil ADM?</span></h1>
        <p class="inicio-sub entra" data-t="start_subtitle"></p>
        <button class="botao botao-grande entra" id="btn-comecar" type="button"><span data-t="start_button"></span><svg><use href="#i-seta"/></svg></button>
        <ul class="inicio-perfis entra" data-t-label="perfis_label"></ul>
      </div>
      <footer class="rodape">
        <span class="rodape-rotulo" data-t="realizacao"></span>
        <img src="assets/marca/curso.webp" alt="Técnico em Administração" width="1458" height="845">
        <img src="assets/marca/escola.webp" alt="EEB Eurico Pinz" width="740" height="759">
      </footer>
    </section>

    <!-- 2. nome -->
    <section class="tela" id="nome">
      <form class="cartaz entra" id="form-nome">
        <h2 data-t="nome_title"></h2>
        <p data-t="nome_subtitle"></p>
        <label for="campo-nome" data-t="name_label"></label>
        <input id="campo-nome" name="nome" type="text" maxlength="24" autocomplete="off" autocapitalize="words" spellcheck="false">
        <button class="botao" type="submit"><span data-t="begin_button"></span><svg><use href="#i-seta"/></svg></button>
      </form>
    </section>

    <!-- 3. abertura de capítulo / rodada relâmpago -->
    <section class="tela" id="intro">
      <div class="intro-faixa">
        <img class="intro-faiscas" src="assets/marca/faiscas.png" alt="" width="145" height="172">
        <p class="intro-rotulo entra"></p>
        <h2 class="intro-titulo entra"></h2>
        <p class="intro-texto entra"></p>
        <button class="botao intro-seguir entra" type="button"><span data-t="continuar"></span><svg><use href="#i-seta"/></svg></button>
        <span class="intro-tempo" aria-hidden="true"></span>
      </div>
    </section>

    <!-- 4. pergunta-cenário (também usada no desempate) -->
    <section class="tela" id="pergunta">
      <div class="pergunta-cabeca">
        <span class="etiqueta entra"></span>
        <h2 class="enunciado entra" tabindex="-1"></h2>
        <p class="intro-desempate entra" data-t="tie_intro" hidden></p>
      </div>
      <div class="opcoes" role="group"></div>
    </section>

    <!-- 5. isto ou aquilo -->
    <section class="tela" id="vs">
      <div class="pergunta-cabeca">
        <span class="etiqueta etiqueta-raio entra"></span>
        <h2 class="enunciado entra" tabindex="-1"></h2>
      </div>
      <div class="opcoes opcoes-vs" role="group"></div>
    </section>

    <!-- 6. calculando -->
    <section class="tela" id="calculando">
      <img class="calc-coroa" src="assets/marca/coroa.png" alt="" width="222" height="154">
      <h2 class="calc-titulo" data-t="loading_title"></h2>
      <div class="calc-pincel" aria-hidden="true"><span></span></div>
      <p class="calculando-frase" aria-live="polite"></p>
    </section>

    <!-- 7. resultado -->
    <section class="tela" id="resultado">
      <article class="cartao">
        <div class="res-heroi">
          <div class="cartao-cabeca">
            <img class="cartao-logo" src="assets/marca/adm-experience-adesivo.webp" alt="ADM Experience" width="1331" height="533">
            <p class="cartao-jogador"></p>
          </div>
          <p class="kicker" data-t="result_kicker"></p>
          <h1 class="res-nome" tabindex="-1">
            <img class="res-coroa" src="assets/marca/coroa.png" alt="" width="222" height="154">
            <span class="res-nome-txt"></span>
          </h1>
          <p class="res-frase"></p>
          <svg class="res-icone" aria-hidden="true"><use href="#ic-criativo"/></svg>
        </div>

        <div class="res-corpo">
          <p class="res-descricao"></p>
          <section class="bloco bloco-mix">
            <h3 data-t="mix_title"></h3>
            <ol class="mix-lista"></ol>
          </section>
          <div class="res-grade">
            <section class="bloco">
              <h3 data-t="pontos_fortes_title"></h3>
              <ul class="chips res-fortes"></ul>
            </section>
            <section class="bloco">
              <h3 data-t="combina_title"></h3>
              <ul class="chips chips-cor res-combina"></ul>
            </section>
            <section class="bloco">
              <h3 data-t="profissoes_title"></h3>
              <ul class="lista res-profissoes"></ul>
            </section>
            <section class="bloco">
              <h3 data-t="no_tecnico_title"></h3>
              <p class="res-tecnico"></p>
            </section>
            <section class="bloco bloco-lado-b">
              <h3 data-t="lado_b_title"></h3>
              <p class="res-lado-b"></p>
            </section>
            <section class="bloco">
              <h3 data-t="dica_title"></h3>
              <p class="res-dica"></p>
            </section>
          </div>
          <p class="cta" data-t="cta"></p>
          <p class="aviso" data-t="aviso"></p>
          <footer class="cartao-rodape">
            <img src="assets/marca/curso.webp" alt="Técnico em Administração" width="1458" height="845">
            <img src="assets/marca/escola.webp" alt="EEB Eurico Pinz" width="740" height="759">
            <span data-t="credits"></span>
          </footer>
        </div>
      </article>

      <div class="acoes">
        <button class="botao botao-secundario" id="btn-imprimir" type="button"><svg><use href="#i-imprimir"/></svg><span data-t="print_button"></span></button>
        <button class="botao" id="btn-reiniciar" type="button"><svg><use href="#i-reiniciar"/></svg><span data-t="restart_button"></span></button>
      </div>
    </section>
  </main>
</body>
</html>
